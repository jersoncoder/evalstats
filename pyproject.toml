[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evalstats"
version = "0.1.0"
description = "Confidence intervals, paired tests, calibration and slice analysis for comparing ML models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jerson Montes" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]
keywords = ["machine learning", "evaluation", "bootstrap", "statistics", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
    "scikit-learn>=1.4",
    "scipy-stubs>=1.14",
]

[project.scripts]
evalstats = "evalstats.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evalstats"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples", "scripts"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: larger simulations, excluded by default (run with -m slow)"]
